name: Prueba en producción
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/production.yml', 'worker.js', 'vite.config.js', 'src-web/**']
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright jsqr
      - run: npx playwright install chromium
        timeout-minutes: 2
      - run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import jsQR from 'jsqr';
          const base = 'https://pizarra-magica-iqtouch.luisnurenagonzales.workers.dev';
          const browser = await chromium.launch({args:['--autoplay-policy=no-user-gesture-required']});
          try {
            const board = await browser.newPage({viewport:{width:900,height:640}});
            const qr = board.locator('aside canvas');
            const target = base+'/?v='+process.env.GITHUB_SHA;
            for(let attempt=0;;attempt++){
              await board.goto(target+'&attempt='+attempt);
              if(await board.locator('#startup').count() && await board.request.get(base+'/teacher?mic=dictado-v3&v='+process.env.GITHUB_SHA).then(async r=>(await r.text()).includes('Borrar anotaciones')))break;
              assert.ok(attempt<29,'Cloudflare no sirvió la versión nueva');
              await new Promise(resolve=>setTimeout(resolve,4000));
            }
            const readQr = async () => {
              await qr.waitFor({timeout:90000});
              const pixels = await qr.evaluate(canvas => ({width:canvas.width,height:canvas.height,data:Array.from(canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data)}));
              return jsQR(new Uint8ClampedArray(pixels.data),pixels.width,pixels.height)?.data;
            };
            const invitation=await readQr();
            assert.ok(invitation?.startsWith(base+'/teacher?mic=dictado-v3#'));
            await board.getByRole('heading',{name:'Vincular celular'}).click();
            const openPhone = async () => {
              const phone=await browser.newPage({viewport:{width:390,height:844}});
              await phone.addInitScript(() => {
                window.SpeechRecognition=class {
                  start(){
                    this.onstart?.();
                    this.onresult?.({results:[[{transcript:'Por qué los gatos duermen tanto'}]]});
                  }
                  stop(){this.onend?.();}
                  abort(){}
                };
              });
              await phone.goto(invitation);
              await phone.getByText('Pizarra conectada',{exact:true}).waitFor();
              return phone;
            };
            const first=await openPhone();
            await qr.waitFor({state:'detached'});
            for (const line of [[[230,180],[245,165],[275,171],[280,200],[238,206],[230,180]],[[590,181],[615,164],[642,177],[644,203],[595,205],[590,181]],[[325,334],[385,370],[465,371],[535,336]]]) {
              await board.mouse.move(...line[0]); await board.mouse.down();
              for (const [x,y] of line.slice(1)) await board.mouse.move(x,y,{steps:6});
              await board.mouse.up();
            }
            await first.getByRole('button',{name:'Toca para hablar'}).waitFor();
            await board.getByRole('button',{name:'Volver al código QR'}).click();
            assert.equal(await readQr(),invitation);
            const teacher=await openPhone();
            await first.getByText('El control pasó a otro dispositivo. Escanea el mismo QR para recuperarlo.',{exact:true}).waitFor();
            await qr.waitFor({state:'detached'});
            assert.equal(await board.locator('body').innerText(),'');
            const animate=teacher.getByRole('button',{name:'Dar vida',exact:true});
            const mic=teacher.getByRole('button',{name:'Toca para hablar'});
            await teacher.waitForFunction(()=>!document.querySelector('#animate').disabled);
            await new Promise(resolve=>setTimeout(resolve,2400));
            assert.ok(await mic.isDisabled(),'El rostro solo debe cobrar vida mediante el control');
            await animate.click();
            await teacher.waitForFunction(()=>!document.querySelector('#mic').disabled);
            assert.ok(await animate.isDisabled());
            await board.mouse.move(750,450);await board.mouse.down();
            await board.mouse.move(810,480,{steps:8});await board.mouse.up();
            assert.equal(await board.evaluate(()=>JSON.parse(localStorage.getItem('board-notes')).length),1);
            assert.ok(await animate.isDisabled());
            await teacher.getByRole('button',{name:'Borrar anotaciones',exact:true}).click();
            await board.waitForFunction(()=>localStorage.getItem('board-notes')==='[]');
            assert.ok(await animate.isDisabled());
            const requests=[];
            teacher.on('request', req=>{
              if(/\/api\/(audio|transcribe|question)\//.test(new URL(req.url()).pathname))requests.push(req);
            });
            await teacher.getByRole('button',{name:'Toca para hablar'}).click();
            assert.equal(await teacher.locator('#question').inputValue(),'Por qué los gatos duermen tanto');
            assert.equal(requests.length,0);
            await teacher.getByRole('button',{name:'Terminar dictado'}).click();
            assert.equal(requests.length,0);
            await teacher.locator('#question').fill('¿Por qué los gatos duermen tanto?');
            const tappedAt=Date.now();
            await teacher.getByRole('button',{name:'Enviar a Gemma'}).click();
            const delivered=teacher.getByText('Respuesta enviada a la pizarra.',{exact:true});
            try{await delivered.waitFor({timeout:60000});}
            catch(error){console.error('Estado IA:',await teacher.locator('#ai').innerText());throw error;}
            await teacher.getByText('Voz de la pizarra · Piper',{exact:true}).waitFor({timeout:90000});
            assert.equal(requests.length,1);
            assert.ok(new URL(requests[0].url()).pathname.startsWith('/api/question/'));
            const payload=requests[0].postDataJSON();
            assert.equal(payload.question,'¿Por qué los gatos duermen tanto?');
            assert.equal(payload.audio,undefined);
            assert.ok((await teacher.locator('#history li').first().innerText()).includes('→'));
            console.log('Mismo QR y traspaso de control verificados. Gemma recibió solo texto y Piper empezó en '+(Date.now()-tappedAt)+' ms.');
            await teacher.getByRole('button',{name:'Borrar rostro'}).click();
            await teacher.waitForFunction(()=>document.querySelector('#mic').disabled);
            await teacher.getByRole('button',{name:'Cerrar sesión'}).click();
            assert.notEqual(await readQr(),invitation);
          } finally { await browser.close(); }
          JS
